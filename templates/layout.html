<!DOCTYPE html>
<html lang="es">
    <head>
        <link rel="icon"
        href="{{ url_for('static', filename='css/img/muertos.png') }}"
        type="image/png">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/minimal.css') }}">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ titulo }}</title>
    </head>
    <body class="minimal-body {% block body_class %}{% endblock %}">
        
     <div class="container minimal-main-container">
    
        <nav class="navbar navbar-expand-lg navbar-light bg-light minimal-navbar">
            <a class="navbar-brand minimal-brand" href="{{ url_for('home') }}">UDL-ICO</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                <li class="nav-item active minimal-nav-item">
                    <a class="nav-link minimal-nav-link" href="{{ url_for('home') }}">Home <span class="sr-only">(current)</span></a>
                </li>
                <li class="nav-item minimal-nav-item">
                    <a class="nav-link minimal-nav-link" href="{{ url_for('servicios') }}">servicios</a>
                </li>
                <li class="nav-item minimal-nav-item">
                    <a class="nav-link minimal-nav-link" href="{{ url_for('productos') }}">productos</a>
                </li>
                <li class="nav-item minimal-nav-item">
                    <a class="nav-link minimal-nav-link" href="{{ url_for('contacto') }}">contacto</a>
                </li>
                </ul>
            </div>
            </nav>
            <main class="minimal-content-container">
            {% block content %} 
            
            {% endblock %}
            </main>
     </div>
     <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
     <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

    <!-- Popper.js -->
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

    <!-- Bootstrap 4.6 JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    </body>
</html>
