{% extends "layout.html" %}

{% block body_class %}productos-page{% endblock %}

{% block content %}
<div class="container">
        <h1 class="minimal-title">Productos</h1>
        <p class="minimal-text">{{mensaje}}</p>
        <p class="minimal-text">Aquí puedes encontrar información sobre los productos que ofrecemos.</p>
</div>
<div id="carouselExampleControls"
class="carousel slide mi-carrusel"
data-ride="carousel">

<div class="carousel-inner">

<div class="carousel-item active">
<img src="{{ url_for('static', filename='css/img/produtos/gorras.jpg') }}"
class="d-block w-100"
alt="Gorras">
</div>

<div class="carousel-item">
<img src="{{ url_for('static', filename='css/img/produtos/playeras.jpg') }}"
class="d-block w-100"
alt="Playeras">
</div>

<div class="carousel-item">
<img src="{{ url_for('static', filename='css/img/produtos/tenis.jpg') }}"
class="d-block w-100"
alt="Tenis">
</div>

</div>

<a class="carousel-control-prev"
href="#carouselExampleControls"
role="button"
data-slide="prev">

<span class="carousel-control-prev-icon"
aria-hidden="true"></span>
</a>

<a class="carousel-control-next"
href="#carouselExampleControls"
role="button"
data-slide="next">

<span class="carousel-control-next-icon"
aria-hidden="true"></span>
</a>

</div>
{% endblock %}
